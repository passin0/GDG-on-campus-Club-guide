<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">三個都是「先做一點點」，但目的完全不一樣</text>

  <!-- Card 1: Prototype -->
  <rect x="30" y="85" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
  <rect x="31" y="86" width="358" height="190" rx="15" fill="#E8F0FE"/>
  <!-- facade icon -->
  <line x1="110" y1="250" x2="310" y2="250" stroke="#80868B" stroke-width="3"/>
  <rect x="135" y="140" width="110" height="110" fill="#4285F4"/>
  <polygon points="125,140 190,105 255,140" fill="#1967D2"/>
  <rect x="175" y="200" width="30" height="50" fill="#FFFFFF"/>
  <rect x="150" y="160" width="22" height="22" fill="#FFFFFF"/><rect x="208" y="160" width="22" height="22" fill="#FFFFFF"/>
  <line x1="245" y1="160" x2="295" y2="250" stroke="#B06000" stroke-width="5"/>
  <line x1="245" y1="205" x2="275" y2="250" stroke="#B06000" stroke-width="5"/>
  <text x="300" y="150" font-size="13" fill="#5F6368">後面只有</text>
  <text x="300" y="168" font-size="13" fill="#5F6368">木板撐著</text>
  <text x="210" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#1967D2">原型</text>
  <text x="210" y="346" text-anchor="middle" font-size="15" fill="#5F6368">Prototype</text>
  <text x="210" y="392" text-anchor="middle" font-size="18" fill="#202124">電影布景，只有門面</text>
  <text x="210" y="430" text-anchor="middle" font-size="16" fill="#5F6368">讓人看看長什麼樣子</text>
  <rect x="130" y="470" width="160" height="44" rx="22" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="210" y="499" text-anchor="middle" font-size="18" font-weight="700" fill="#C5221F">看完就丟</text>

  <!-- Card 2: Spike -->
  <rect x="420" y="85" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
  <rect x="421" y="86" width="358" height="190" rx="15" fill="#FEF7E0"/>
  <!-- spike icon -->
  <rect x="470" y="200" width="260" height="60" fill="#E8D5B5"/>
  <line x1="470" y1="200" x2="730" y2="200" stroke="#B06000" stroke-width="3"/>
  <circle cx="530" cy="230" r="5" fill="#C9AE85"/><circle cx="660" cy="240" r="6" fill="#C9AE85"/><circle cx="690" cy="215" r="4" fill="#C9AE85"/>
  <rect x="592" y="120" width="16" height="125" fill="#80868B"/>
  <polygon points="592,245 608,245 600,262" fill="#80868B"/>
  <rect x="572" y="110" width="56" height="14" rx="4" fill="#5F6368"/>
  <circle cx="680" cy="135" r="22" fill="#FFFFFF" stroke="#FBBC04" stroke-width="3"/>
  <text x="680" y="144" text-anchor="middle" font-size="24" font-weight="700" fill="#B06000">?</text>
  <text x="600" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#B06000">Spike</text>
  <text x="600" y="346" text-anchor="middle" font-size="15" fill="#5F6368">限時小實驗</text>
  <text x="600" y="392" text-anchor="middle" font-size="18" fill="#202124">用一根長釘戳戳看地基</text>
  <text x="600" y="430" text-anchor="middle" font-size="16" fill="#5F6368">只回答一個技術問題</text>
  <rect x="490" y="470" width="220" height="44" rx="22" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="600" y="499" text-anchor="middle" font-size="17" font-weight="700" fill="#C5221F">答案留下，程式丟掉</text>

  <!-- Card 3: Skeleton -->
  <rect x="810" y="85" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#34A853" stroke-width="4"/>
  <rect x="812" y="87" width="356" height="189" rx="14" fill="#E6F4EA"/>
  <!-- skeleton icon -->
  <g fill="none" stroke="#34A853" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="900" y1="250" x2="1080" y2="250" stroke="#80868B" stroke-width="3"/>
    <polyline points="920,250 920,160 990,110 1060,160 1060,250"/>
    <line x1="920" y1="160" x2="1060" y2="160"/>
    <line x1="920" y1="205" x2="1060" y2="205"/>
    <line x1="967" y1="160" x2="967" y2="250"/>
    <line x1="1013" y1="160" x2="1013" y2="250"/>
    <line x1="990" y1="110" x2="990" y2="160"/>
  </g>
  <rect x="1050" y="96" width="108" height="32" rx="16" fill="#34A853"/>
  <text x="1104" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">你的切片 1</text>
  <text x="990" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#188038">骨架</text>
  <text x="990" y="346" text-anchor="middle" font-size="15" fill="#5F6368">Walking Skeleton</text>
  <text x="990" y="392" text-anchor="middle" font-size="18" fill="#202124">房子的鋼筋骨架，醜，但會走路</text>
  <text x="990" y="430" text-anchor="middle" font-size="16" fill="#5F6368">從頭到尾都能跑的最陽春版本</text>
  <rect x="890" y="470" width="200" height="44" rx="22" fill="#34A853"/>
  <text x="990" y="499" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">留下來慢慢長肉</text>

  <text x="600" y="590" text-anchor="middle" font-size="17" fill="#5F6368">AI 很快就能生出「看起來很像真的」原型；如果你捨不得丟，就不要再加功能了，直接改做骨架</text>
</svg>
