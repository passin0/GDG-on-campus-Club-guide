<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="860" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5F6368"/></marker>
  </defs>
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">新手的三個問題：一關一關過</text>

  <!-- start -->
  <rect x="180" y="85" width="300" height="60" rx="30" fill="#F1F3F4" stroke="#DADCE0" stroke-width="2"/>
  <text x="330" y="124" text-anchor="middle" font-size="20" fill="#202124">你的 4 步使用流程</text>
  <line x1="330" y1="145" x2="330" y2="183" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- gate 1 -->
  <rect x="130" y="190" width="400" height="90" rx="14" fill="#E8F0FE" stroke="#4285F4" stroke-width="3"/>
  <text x="330" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#1967D2">第一關</text>
  <text x="330" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">有沒有人要？</text>
  <line x1="530" y1="235" x2="608" y2="235" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="560" y="220" text-anchor="middle" font-size="16" fill="#5F6368">沒有</text>
  <rect x="615" y="195" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
  <text x="780" y="230" text-anchor="middle" font-size="18" fill="#202124">回到問題句</text>
  <text x="780" y="258" text-anchor="middle" font-size="16" fill="#5F6368">重新找痛點</text>
  <line x1="330" y1="280" x2="330" y2="358" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="345" y="325" font-size="16" fill="#5F6368">有（就算只有你自己）</text>

  <!-- gate 2 -->
  <rect x="130" y="365" width="400" height="90" rx="14" fill="#FEF7E0" stroke="#FBBC04" stroke-width="3"/>
  <text x="330" y="401" text-anchor="middle" font-size="17" font-weight="700" fill="#B06000">第二關</text>
  <text x="330" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">做不做得出來？</text>
  <line x1="530" y1="410" x2="608" y2="410" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="560" cy="392" r="8" fill="#EA4335"/>
  <rect x="615" y="370" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
  <text x="780" y="405" text-anchor="middle" font-size="18" fill="#202124">先做 30 分鐘小實驗</text>
  <text x="780" y="433" text-anchor="middle" font-size="16" fill="#5F6368">做不出來，就這版先不要</text>
  <line x1="330" y1="455" x2="330" y2="533" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="353" cy="494" r="8" fill="#34A853"/>
  <circle cx="375" cy="494" r="8" fill="#FBBC04"/>
  <text x="392" y="500" font-size="16" fill="#5F6368">做得到，或查得到</text>

  <!-- gate 3 -->
  <rect x="130" y="540" width="400" height="90" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="3"/>
  <text x="330" y="576" text-anchor="middle" font-size="17" font-weight="700" fill="#C5221F">第三關</text>
  <text x="330" y="610" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">做不做得完？</text>
  <line x1="530" y1="585" x2="608" y2="585" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="560" y="570" text-anchor="middle" font-size="16" fill="#5F6368">做不完</text>
  <rect x="615" y="545" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
  <text x="780" y="580" text-anchor="middle" font-size="18" fill="#202124">砍範疇</text>
  <text x="780" y="608" text-anchor="middle" font-size="16" fill="#5F6368">下一節教你怎麼砍</text>
  <line x1="330" y1="630" x2="330" y2="708" stroke="#5F6368" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="345" y="675" font-size="16" fill="#5F6368">做得完</text>

  <!-- go -->
  <rect x="200" y="715" width="260" height="70" rx="35" fill="#34A853"/>
  <text x="330" y="760" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">開工！</text>

  <text x="500" y="830" text-anchor="middle" font-size="17" fill="#5F6368">很多第一個作品不是死在技術，而是死在這三題的其中一題</text>
</svg>
