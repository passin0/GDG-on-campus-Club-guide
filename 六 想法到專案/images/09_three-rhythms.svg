<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5F6368"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#EA4335"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#34A853"/></marker>
  </defs>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">三種開發節奏</text>

  <!-- Row 1: Waterfall -->
  <rect x="30" y="85" width="1140" height="180" rx="16" fill="#F8F9FA"/>
  <text x="60" y="155" font-size="24" font-weight="700" fill="#1967D2">瀑布</text>
  <text x="60" y="183" font-size="15" fill="#5F6368">Waterfall</text>
  <text x="60" y="215" font-size="16" fill="#202124">一次走完一整條</text>
  <line x1="360" y1="165" x2="1000" y2="165" stroke="#4285F4" stroke-width="4"/>
  <g font-size="18" text-anchor="middle" fill="#202124">
    <circle cx="360" cy="165" r="18" fill="#4285F4"/><text x="360" y="215">需求</text>
    <circle cx="520" cy="165" r="18" fill="#4285F4"/><text x="520" y="215">設計</text>
    <circle cx="680" cy="165" r="18" fill="#4285F4"/><text x="680" y="215">寫程式</text>
    <circle cx="840" cy="165" r="18" fill="#4285F4"/><text x="840" y="215">測試</text>
    <circle cx="1000" cy="165" r="18" fill="#4285F4"/><text x="1000" y="215">上線</text>
  </g>
  <text x="1080" y="171" font-size="15" fill="#5F6368">不回頭</text>

  <!-- Row 2: Agile -->
  <rect x="30" y="285" width="1140" height="190" rx="16" fill="#F8F9FA"/>
  <text x="60" y="355" font-size="24" font-weight="700" fill="#188038">敏捷</text>
  <text x="60" y="383" font-size="15" fill="#5F6368">Agile（Scrum、Kanban）</text>
  <text x="60" y="415" font-size="16" fill="#202124">切成很多小圈</text>
  <text x="60" y="440" font-size="16" fill="#202124">每圈都交出能用的版本</text>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#188038">
    <g transform="translate(360,365)"><path d="M -30 -20 A 36 36 0 1 1 -32 16" fill="none" stroke="#34A853" stroke-width="4" marker-end="url(#ag)"/><text y="7">v1</text></g>
    <g transform="translate(520,365)"><path d="M -30 -20 A 36 36 0 1 1 -32 16" fill="none" stroke="#34A853" stroke-width="4" marker-end="url(#ag)"/><text y="7">v2</text></g>
    <g transform="translate(680,365)"><path d="M -30 -20 A 36 36 0 1 1 -32 16" fill="none" stroke="#34A853" stroke-width="4" marker-end="url(#ag)"/><text y="7">v3</text></g>
    <g transform="translate(840,365)"><path d="M -30 -20 A 36 36 0 1 1 -32 16" fill="none" stroke="#34A853" stroke-width="4" marker-end="url(#ag)"/><text y="7">v4</text></g>
    <g transform="translate(1000,365)"><path d="M -30 -20 A 36 36 0 1 1 -32 16" fill="none" stroke="#34A853" stroke-width="4" marker-end="url(#ag)"/><text y="7">v5</text></g>
  </g>
  <g stroke="#5F6368" stroke-width="2.5">
    <line x1="402" y1="365" x2="470" y2="365" marker-end="url(#a)"/>
    <line x1="562" y1="365" x2="630" y2="365" marker-end="url(#a)"/>
    <line x1="722" y1="365" x2="790" y2="365" marker-end="url(#a)"/>
    <line x1="882" y1="365" x2="950" y2="365" marker-end="url(#a)"/>
  </g>
  <text x="680" y="452" text-anchor="middle" font-size="16" fill="#5F6368">每一圈都是：小需求 → 做 → 測 → 交付</text>

  <!-- Row 3: AI loop -->
  <rect x="30" y="495" width="1140" height="205" rx="16" fill="#F8F9FA"/>
  <text x="60" y="560" font-size="24" font-weight="700" fill="#C5221F">AI 迴圈</text>
  <text x="60" y="588" font-size="15" fill="#5F6368">Loop Engineering</text>
  <text x="60" y="620" font-size="16" fill="#202124">人定好目標和完成條件</text>
  <text x="60" y="645" font-size="16" fill="#202124">AI 自己繞圈做到過關</text>

  <rect x="290" y="545" width="200" height="70" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="390" y="574" text-anchor="middle" font-size="14" fill="#1967D2">人</text>
  <text x="390" y="600" text-anchor="middle" font-size="17" fill="#202124">目標＋完成條件</text>
  <rect x="550" y="545" width="140" height="70" rx="12" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
  <text x="620" y="587" text-anchor="middle" font-size="19" fill="#202124">AI 寫</text>
  <rect x="750" y="545" width="140" height="70" rx="12" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
  <text x="820" y="587" text-anchor="middle" font-size="19" fill="#202124">跑測試</text>
  <rect x="960" y="545" width="190" height="70" rx="12" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="1055" y="587" text-anchor="middle" font-size="17" fill="#202124">交給人檢查</text>

  <g stroke="#5F6368" stroke-width="2.5">
    <line x1="490" y1="580" x2="543" y2="580" marker-end="url(#a)"/>
    <line x1="690" y1="580" x2="743" y2="580" marker-end="url(#a)"/>
    <line x1="890" y1="580" x2="953" y2="580" marker-end="url(#a)"/>
  </g>
  <text x="922" y="562" text-anchor="middle" font-size="14" fill="#188038">過了</text>
  <path d="M820,615 V660 H620 V625" fill="none" stroke="#EA4335" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="720" y="685" text-anchor="middle" font-size="15" fill="#C5221F">沒過：自己修，再跑一次</text>
</svg>
