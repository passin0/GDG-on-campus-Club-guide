<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1100" height="790" fill="#FFFFFF"/>
  <text x="550" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">連續問五次「為什麼」：像剝洋蔥一樣往下挖</text>

  <!-- symptom -->
  <rect x="40" y="80" width="560" height="64" rx="12" fill="#F1F3F4" stroke="#DADCE0" stroke-width="2"/>
  <text x="64" y="120" font-size="20" fill="#202124"><tspan font-weight="700">症狀：</tspan>學生總是不來參加社課（Q-Q）</text>

  <g fill="none" stroke="#BDC1C6" stroke-width="2.5">
    <path d="M70,144 V207 H100"/>
    <path d="M130,239 V302 H160"/>
    <path d="M190,334 V397 H220"/>
    <path d="M250,429 V492 H280"/>
    <path d="M310,524 V587 H340"/>
  </g>

  <!-- whys -->
  <g font-size="19" fill="#202124">
    <rect x="100" y="175" width="600" height="64" rx="12" fill="#FFFFFF" stroke="#4285F4" stroke-width="2"/>
    <rect x="100" y="175" width="96" height="64" rx="12" fill="#4285F4"/>
    <text x="148" y="214" text-anchor="middle" font-weight="700" fill="#FFFFFF">Why 1</text>
    <text x="214" y="214">因為他們忘記時間。<tspan fill="#80868B" font-size="16">（表象原因）</tspan></text>

    <rect x="160" y="270" width="600" height="64" rx="12" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
    <rect x="160" y="270" width="96" height="64" rx="12" fill="#EA4335"/>
    <text x="208" y="309" text-anchor="middle" font-weight="700" fill="#FFFFFF">Why 2</text>
    <text x="274" y="309">因為提醒訊息淹沒在群組裡。</text>

    <rect x="220" y="365" width="600" height="64" rx="12" fill="#FFFFFF" stroke="#FBBC04" stroke-width="2"/>
    <rect x="220" y="365" width="96" height="64" rx="12" fill="#FBBC04"/>
    <text x="268" y="404" text-anchor="middle" font-weight="700" fill="#202124">Why 3</text>
    <text x="334" y="404">因為大家習慣把群組設靜音。</text>

    <rect x="280" y="460" width="600" height="64" rx="12" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
    <rect x="280" y="460" width="96" height="64" rx="12" fill="#34A853"/>
    <text x="328" y="499" text-anchor="middle" font-weight="700" fill="#FFFFFF">Why 4</text>
    <text x="394" y="499">因為群組裡太多無關的閒聊。</text>

    <rect x="340" y="555" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#4285F4" stroke-width="2"/>
    <rect x="340" y="555" width="96" height="64" rx="12" fill="#4285F4"/>
    <text x="388" y="594" text-anchor="middle" font-weight="700" fill="#FFFFFF">Why 5</text>
    <text x="454" y="594">因為公告和閒聊都丟在同一個群組，沒有分開。</text>
  </g>

  <!-- root -->
  <path d="M370,619 V662" fill="none" stroke="#34A853" stroke-width="3"/>
  <path d="M362,656 L370,670 L378,656 z" fill="#34A853"/>
  <rect x="340" y="672" width="720" height="70" rx="14" fill="#34A853"/>
  <text x="700" y="715" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">根本問題：資訊缺乏「優先級分類」和「重要推播機制」</text>

  <!-- annotations -->
  <text x="720" y="200" font-size="15" fill="#80868B">停在這一層</text>
  <text x="720" y="224" font-size="15" fill="#80868B">→ 你會做一個「上課提醒鬧鐘」</text>
  <text x="40" y="700" font-size="15" fill="#188038">挖到這一層</text>
  <text x="40" y="724" font-size="15" fill="#188038">→ 該解決的是</text>
  <text x="40" y="748" font-size="15" fill="#188038">「公告和閒聊沒分開」</text>
</svg>
