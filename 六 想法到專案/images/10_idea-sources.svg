<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1100" height="640" fill="#FFFFFF"/>
  <text x="550" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">想法從哪裡來？三種來源</text>

  <!-- root -->
  <rect x="30" y="310" width="220" height="70" rx="35" fill="#202124"/>
  <text x="140" y="352" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">想法從哪裡來？</text>
  <g fill="none" stroke="#BDC1C6" stroke-width="3">
    <path d="M250,345 C285,345 285,160 320,160"/>
    <path d="M250,345 L320,345"/>
    <path d="M250,345 C285,345 285,530 320,530"/>
  </g>

  <!-- 1 Problem -->
  <rect x="320" y="85" width="750" height="150" rx="14" fill="#FFFFFF" stroke="#4285F4" stroke-width="2"/>
  <rect x="320" y="85" width="10" height="150" rx="5" fill="#4285F4"/>
  <circle cx="368" cy="125" r="18" fill="#4285F4"/><text x="368" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="398" y="133" font-size="22" font-weight="700" fill="#1967D2">Problem-driven</text>
  <text x="590" y="133" font-size="19" fill="#202124">「我遇到了什麼問題？」</text>
  <text x="350" y="180" font-size="17" fill="#5F6368">例：每次下載的檔案都亂七八糟</text>
  <text x="350" y="210" font-size="17" fill="#202124">→ 做一個檔案整理 AI Agent</text>

  <!-- 2 Interest -->
  <rect x="320" y="270" width="750" height="150" rx="14" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="320" y="270" width="10" height="150" rx="5" fill="#EA4335"/>
  <circle cx="368" cy="310" r="18" fill="#EA4335"/><text x="368" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="398" y="318" font-size="22" font-weight="700" fill="#C5221F">Interest-driven</text>
  <text x="590" y="318" font-size="19" fill="#202124">「我對什麼東西感興趣？」</text>
  <text x="350" y="365" font-size="17" fill="#5F6368">例：我很喜歡音樂 → 一直想知道手勢能不能指揮音樂</text>
  <text x="350" y="395" font-size="17" fill="#202124">→ 手勢辨識 × 音樂控制（不一定要有痛點，「這感覺很酷，我想玩玩看」）</text>

  <!-- 3 Domain -->
  <rect x="320" y="455" width="750" height="150" rx="14" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="320" y="455" width="10" height="150" rx="5" fill="#34A853"/>
  <circle cx="368" cy="495" r="18" fill="#34A853"/><text x="368" y="502" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="398" y="503" font-size="22" font-weight="700" fill="#188038">Domain-driven</text>
  <text x="590" y="503" font-size="19" fill="#202124">「進入不熟的領域，看到什麼怪事？」</text>
  <text x="350" y="550" font-size="17" fill="#5F6368">例：資工學生跑去社團、醫院、餐廳、行銷、運動、音樂、遊戲……</text>
  <text x="350" y="580" font-size="17" fill="#202124">→ 然後突然：「蛤？你們現在還在這樣做？為什麼？」</text>
</svg>
