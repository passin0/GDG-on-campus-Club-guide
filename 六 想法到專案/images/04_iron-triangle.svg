<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="760" fill="#FFFFFF"/>
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">專案鐵三角 × 新手的三個問題</text>

  <!-- triangle -->
  <polygon points="500,190 250,560 750,560" fill="#F8F9FA" stroke="#DADCE0" stroke-width="4" stroke-linejoin="round"/>
  <text x="500" y="420" text-anchor="middle" font-size="20" fill="#5F6368">三邊互相拉扯</text>
  <text x="500" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">你唯一能調的</text>
  <text x="500" y="487" text-anchor="middle" font-size="22" font-weight="700" fill="#188038">只有範疇</text>

  <!-- vertex: scope (top) -->
  <circle cx="500" cy="190" r="16" fill="#34A853"/>
  <rect x="330" y="80" width="340" height="90" rx="14" fill="#E6F4EA" stroke="#34A853" stroke-width="3"/>
  <text x="500" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">範疇：要做哪些東西</text>
  <text x="500" y="140" text-anchor="middle" font-size="17" fill="#5F6368">↔ 有沒有人要？</text>
  <rect x="680" y="100" width="120" height="44" rx="22" fill="#34A853"/>
  <text x="740" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">可以調</text>

  <!-- vertex: time (bottom-left) -->
  <circle cx="250" cy="560" r="16" fill="#EA4335"/>
  <rect x="40" y="590" width="360" height="110" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="220" y="625" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">時間：什麼時候做完</text>
  <text x="220" y="653" text-anchor="middle" font-size="17" fill="#5F6368">↔ 做不做得完？</text>
  <text x="220" y="682" text-anchor="middle" font-size="16" fill="#C5221F">動不了：學期中，每週就那幾小時</text>

  <!-- vertex: resources (bottom-right) -->
  <circle cx="750" cy="560" r="16" fill="#EA4335"/>
  <rect x="600" y="590" width="360" height="110" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="780" y="625" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">資源：能力、工具、AI</text>
  <text x="780" y="653" text-anchor="middle" font-size="17" fill="#5F6368">↔ 做不做得出來？</text>
  <text x="780" y="682" text-anchor="middle" font-size="16" fill="#C5221F">動不了：短期內改不了</text>

  <text x="500" y="740" text-anchor="middle" font-size="17" fill="#5F6368">想做的變多，時間就要變長；時間跟能力都卡住，就只能少做一點</text>
</svg>
