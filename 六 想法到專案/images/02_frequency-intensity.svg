<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="720" fill="#FFFFFF"/>
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">痛點的「頻率」與「強度」</text>

  <!-- quadrants -->
  <rect x="140" y="110" width="380" height="250" rx="14" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <rect x="540" y="110" width="380" height="250" rx="14" fill="#E6F4EA" stroke="#34A853" stroke-width="3"/>
  <rect x="140" y="380" width="380" height="250" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <rect x="540" y="380" width="380" height="250" rx="14" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>

  <!-- top-left: low freq, high pain -->
  <text x="330" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#1967D2">值得做</text>
  <text x="330" y="236" text-anchor="middle" font-size="19" fill="#202124">但要想想用的人多不多</text>
  <text x="330" y="300" text-anchor="middle" font-size="17" fill="#5F6368">例：一年一次的租屋合約糾紛</text>

  <!-- top-right: high freq, high pain -->
  <text x="730" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#188038">★ 黃金題目</text>
  <text x="730" y="236" text-anchor="middle" font-size="19" fill="#202124">一定要解決</text>
  <text x="730" y="300" text-anchor="middle" font-size="17" fill="#5F6368">例：每天選課、選餐卡爆</text>

  <!-- bottom-left: low freq, low pain -->
  <text x="330" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#C5221F">危險紅燈</text>
  <text x="330" y="506" text-anchor="middle" font-size="19" fill="#202124">做了很可能沒人用</text>
  <text x="330" y="570" text-anchor="middle" font-size="17" fill="#5F6368">例：一年用一次的校園地圖微調</text>

  <!-- bottom-right: high freq, low pain -->
  <text x="730" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#B06000">可以做</text>
  <text x="730" y="506" text-anchor="middle" font-size="19" fill="#202124">但可能不是剛需</text>
  <text x="730" y="570" text-anchor="middle" font-size="17" fill="#5F6368">例：偶爾懶得手動輸入密碼</text>

  <!-- axes -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5F6368"/>
    </marker>
  </defs>
  <line x1="110" y1="640" x2="110" y2="105" stroke="#5F6368" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="130" y1="660" x2="935" y2="660" stroke="#5F6368" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="58" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">很痛</text>
  <text x="58" y="620" text-anchor="middle" font-size="18" fill="#5F6368">不太痛</text>
  <text x="58" y="378" text-anchor="middle" font-size="18" fill="#5F6368">強度</text>
  <text x="160" y="695" font-size="18" fill="#5F6368">不常發生</text>
  <text x="530" y="695" text-anchor="middle" font-size="18" fill="#5F6368">頻率</text>
  <text x="915" y="695" text-anchor="end" font-size="18" font-weight="700" fill="#202124">很常發生</text>
</svg>
