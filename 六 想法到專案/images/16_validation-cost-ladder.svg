<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#EA4335"/></marker>
    <g id="coin"><circle r="11" fill="#FBBC04" stroke="#E37400" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#B06000">$</text></g>
  </defs>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">不寫程式，也能知道有沒有人要：驗證成本階梯</text>

  <!-- axis -->
  <line x1="40" y1="610" x2="40" y2="130" stroke="#EA4335" stroke-width="3" marker-end="url(#a)"/>
  <text x="58" y="140" font-size="16" font-weight="700" fill="#C5221F">越往上越貴</text>

  <!-- steps: x, top -->
  <!-- 0 -->
  <rect x="70" y="530" width="180" height="80" rx="10" fill="#F1F3F4" stroke="#DADCE0" stroke-width="2"/>
  <text x="160" y="562" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">自己覺得很需要</text>
  <text x="160" y="590" text-anchor="middle" font-size="14" fill="#5F6368">免費，但不算數</text>

  <!-- 1 -->
  <rect x="250" y="460" width="180" height="150" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="340" y="490" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">問三個人</text>
  <text x="340" y="514" text-anchor="middle" font-size="15" fill="#202124">「你現在怎麼處理」</text>
  <use href="#coin" x="340" y="542"/>
  <text x="340" y="580" text-anchor="middle" font-size="13" fill="#5F6368">三關健康檢查的第一格</text>

  <!-- 2 -->
  <rect x="430" y="390" width="180" height="220" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="520" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">先找現成工具</text>
  <text x="520" y="444" text-anchor="middle" font-size="15" fill="#202124">用用看</text>
  <use href="#coin" x="520" y="472"/>
  <text x="520" y="508" text-anchor="middle" font-size="13" fill="#5F6368">捷運、YouBike、Uber</text>
  <text x="520" y="528" text-anchor="middle" font-size="13" fill="#5F6368">已經解決了多少？</text>

  <!-- 3 -->
  <rect x="610" y="320" width="180" height="290" rx="10" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
  <text x="700" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">做一個假畫面</text>
  <text x="700" y="374" text-anchor="middle" font-size="15" fill="#202124">給人點點看</text>
  <use href="#coin" x="688" y="402"/><use href="#coin" x="712" y="402"/>
  <text x="700" y="438" text-anchor="middle" font-size="13" fill="#5F6368">畫傳送門的操作畫面，</text>
  <text x="700" y="458" text-anchor="middle" font-size="13" fill="#5F6368">看阿嬤看不看得懂</text>

  <!-- 4 -->
  <rect x="790" y="250" width="180" height="360" rx="10" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
  <text x="880" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">人工假裝系統</text>
  <use href="#coin" x="856" y="312"/><use href="#coin" x="880" y="312"/><use href="#coin" x="904" y="312"/>
  <text x="880" y="348" text-anchor="middle" font-size="13" fill="#5F6368">「傳送鹹酥雞」表單，</text>
  <text x="880" y="368" text-anchor="middle" font-size="13" fill="#5F6368">背後其實是你騎車去買</text>
  <text x="880" y="392" text-anchor="middle" font-size="13" fill="#5F6368">（恭喜，你發明了外送）</text>

  <!-- 5 -->
  <rect x="970" y="180" width="180" height="430" rx="10" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
  <text x="1060" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">寫完整程式</text>
  <use href="#coin" x="1024" y="242"/><use href="#coin" x="1048" y="242"/><use href="#coin" x="1072" y="242"/><use href="#coin" x="1096" y="242"/>
  <text x="1060" y="278" text-anchor="middle" font-size="13" fill="#5F6368">幾週到幾個月</text>

  <text x="600" y="655" text-anchor="middle" font-size="18" fill="#202124">能用便宜的方法知道答案，就不要用貴的。<tspan font-weight="700" fill="#C5221F">寫程式是最貴的驗證方式。</tspan></text>
</svg>
